# ============================================================
# Emergency Route Finder — Backend Configuration
# IMPORTANT: Do NOT commit this file with real credentials.
# Copy this file to application-local.properties and fill in values.
# ============================================================

spring.application.name=emergency-route-finder-backend
server.port=${PORT:8080}
server.address=0.0.0.0

# ============================================================
# MySQL Data Source (Supports standard Spring Boot & Railway env vars)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:emergency_route_finder}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.pool-name=ERF-Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=${JWT_SECRET:EmergencyRouteFinderSecretKey2024AbcXyz987654321QwErTy}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Google Maps / Routes API
# ============================================================
google.maps.api-key=${GOOGLE_MAPS_API_KEY:DEMO_MODE_NO_KEY}
google.routes.api-url=https://routes.googleapis.com/directions/v2:computeRoutes
google.maps.enable-traffic=true

# ============================================================
# Firebase Admin SDK
# ============================================================
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
firebase.enabled=${FIREBASE_ENABLED:false}

# ============================================================
# Traffic Fusion Weights (must sum to 1.0)
# ============================================================
traffic.fusion.weight.google=0.50
traffic.fusion.weight.camera=0.25
traffic.fusion.weight.crowd=0.25

# ============================================================
# Crowd Traffic Freshness Window (minutes)
# ============================================================
traffic.crowd.freshness-minutes=15

# ============================================================
# Location Update Interval
# ============================================================
location.update-interval-seconds=10

# ============================================================
# CORS (update for production)
# ============================================================
cors.allowed-origins=*

# ============================================================
# WebSocket
# ============================================================
websocket.endpoint=/ws
websocket.topic-prefix=/topic
websocket.app-prefix=/app

# ============================================================
# Actuator / Health
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# ============================================================
# Logging
# ============================================================
logging.level.com.emergencyroutefinder=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO


